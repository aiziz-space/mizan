<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ميزان</title>
  <meta name="description" content="متابعة الوزن والسعرات والتمارين">
  <meta name="theme-color" content="#0b0f0e">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ميزان">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/plex-arabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/calc.js"></script>
  <script defer src="js/data-exercises.js"></script>
  <script defer src="js/data-programs.js"></script>
  <script defer src="js/data-tips.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/figure.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/timer.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="tb-text"><small id="subtitle"></small><h1 id="title">ميزان</h1></div>
    <div class="streak" id="streak" aria-label="الأيام المتتالية"></div>
  </header>

  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-food" hidden></section>
    <section class="view" id="view-train" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-more" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="active"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h4.5V14h4v5.5h4.5V9"/></svg><span>الرئيسية</span></button>
    <button data-view="food"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M8 12v9"/><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3h3.5"/></svg><span>الأكل</span></button>
    <button data-view="train"><svg class="ic" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg><span>التمارين</span></button>
    <button data-view="progress"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M5 16l4.5-5 3.5 3 6-7"/></svg><span>التقدم</span></button>
    <button data-view="more"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg><span>الإعدادات</span></button>
  </nav>

  <!-- Bottom sheet -->
  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2 id="sheet-title"></h2>
        <button class="icon-btn" id="sheet-close" aria-label="إغلاق"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Fullscreen workout timer -->
  <div class="timer" id="timer" hidden>
    <div class="t-top">
      <button class="icon-btn glass" id="t-close" aria-label="إنهاء"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="t-title" id="t-title"></div>
      <div class="t-left" id="t-left"></div>
    </div>
    <div class="t-progress"><i id="t-progress"></i></div>
    <div class="t-kind-row"><span class="t-kind" id="t-kind"></span><span class="t-round" id="t-round"></span></div>
    <div class="t-stage">
      <svg class="t-ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="t-ring-bg" cx="120" cy="120" r="108"/>
        <circle class="t-ring-fg" id="t-ring" cx="120" cy="120" r="108" stroke-dasharray="678.58" stroke-dashoffset="0" transform="rotate(-90 120 120)"/>
      </svg>
      <div class="t-fig" id="t-fig"></div>
      <div class="t-time" id="t-time" aria-live="off">0</div>
      <div class="t-paused-label">متوقف مؤقتاً</div>
    </div>
    <div class="t-name" id="t-name"></div>
    <div class="t-hint" id="t-hint"></div>
    <div class="t-next" id="t-next"></div>
    <div class="t-controls">
      <button class="icon-btn glass lg" id="t-prev-btn" aria-label="السابق"><svg class="ic" viewBox="0 0 24 24"><path d="m14.5 5 7 7-7 7M3 12h17"/></svg></button>
      <button class="t-play" id="t-pause" aria-label="إيقاف مؤقت"></button>
      <button class="icon-btn glass lg" id="t-next-btn" aria-label="التالي"><svg class="ic" viewBox="0 0 24 24"><path d="m9.5 5-7 7 7 7M21 12H4"/></svg></button>
    </div>
  </div>

  <!-- Workout complete -->
  <div class="celebrate" id="celebrate" hidden>
    <div class="cel-card">
      <div class="cel-badge"><svg viewBox="0 0 80 80"><circle class="cel-c" cx="40" cy="40" r="34"/><path class="cel-check" d="m24 41 11 11 22-24"/></svg></div>
      <h2 id="cel-title"></h2>
      <div class="cel-stats" id="cel-stats"></div>
      <button class="btn primary big full" id="cel-ok">تم</button>
    </div>
  </div>

  <!-- Dialog -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-card" role="alertdialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2><p id="dialog-text"></p>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </div>

  <div class="update-banner" id="update-banner" hidden>
    <span>فيه تحديث جديد لميزان</span><button class="btn primary sm" id="update-reload">تحديث</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <canvas id="fx" hidden></canvas>
</body>
</html>
